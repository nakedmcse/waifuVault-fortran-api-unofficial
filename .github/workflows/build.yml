# Build libs

name: Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Update repos
      run: sudo apt-get update
    - name: Install Dependencies
      run: sudo apt-get install -y libcurl4-openssl-dev
    - name: Build tests
      run: make buildunittests
    - name: Run tests
      run: ./waifuunittests
    - name: Clean tests
      run: make clean
    - name: Build libraries
      run: make build
